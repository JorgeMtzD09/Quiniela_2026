<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a472a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Quiniela Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>Quiniela Mundial 2026</h1>
      <p class="subtitle">Fase de Grupos</p>
    </div>
    <button class="btn-refresh" id="btnRefresh" aria-label="Actualizar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>
  </header>

  <div class="status-bar" id="statusBar">
    <span class="status-dot"></span>
    <span id="statusText">Cargando...</span>
  </div>

  <main class="main">
    <section class="view active" id="viewPodio">
      <div class="section-header">
        <h2>Tabla General</h2>
      </div>
      <div id="podioContent" class="podio-list"></div>
    </section>

    <section class="view" id="viewPersonas">
      <div class="section-header">
        <h2>Pronósticos</h2>
        <span class="badge" id="playedCount">0/72</span>
      </div>
      <div class="person-tabs" id="personTabs"></div>
      <div class="person-summary" id="personSummary"></div>
      <div id="personContent" class="match-list"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="podio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
        <path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20 7 22"/>
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20 17 22"/>
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
      <span>Podio</span>
    </button>
    <button class="nav-btn" data-view="personas">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Personas</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
