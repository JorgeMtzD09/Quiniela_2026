<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a472a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Quiniela Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>Quiniela Mundial 2026</h1>
      <p class="subtitle" id="headerSubtitle">Fase de Grupos</p>
    </div>
    <div class="header-actions">
      <button class="btn-logout" id="btnLogout" type="button" hidden>Salir</button>
      <button class="btn-refresh" id="btnRefresh" aria-label="Actualizar" title="Reconectar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="status-bar" id="statusBar">
    <span class="status-dot"></span>
    <span id="statusText">Cargando...</span>
  </div>

  <main class="main">
    <section class="view" id="viewLogin">
      <div class="login-card" id="loginCard">
        <h2 class="login-title">Iniciar sesión</h2>
        <p class="login-hint">Ingresa tu usuario y la clave que te compartieron para ver y editar la quiniela.</p>
        <form id="loginForm" class="login-form">
          <label class="form-label" for="loginUsuario">Usuario</label>
          <input class="form-input" type="text" id="loginUsuario" autocomplete="username"
                 placeholder="ej. abi" autocapitalize="none" autocorrect="off" spellcheck="false" required>
          <label class="form-label" for="loginPassword">Clave</label>
          <input class="form-input" type="password" id="loginPassword" autocomplete="current-password"
                 placeholder="Tu clave" required>
          <p class="login-error" id="loginError" hidden></p>
          <button type="submit" class="btn-primary" id="btnLogin">Entrar</button>
        </form>
      </div>
    </section>

    <section class="view" id="viewPodio">
      <div class="section-header">
        <h2>Tabla General</h2>
      </div>
      <div id="podioContent" class="podio-list"></div>
    </section>

    <section class="view" id="viewQuiniela">
      <div class="section-header">
        <h2>Quiniela</h2>
        <span class="badge" id="playedCount">0/72</span>
      </div>
      <div class="person-tabs" id="personTabs"></div>
      <div class="person-summary" id="personSummary"></div>
      <div id="quinielaHint"></div>
      <div id="personContent" class="match-list"></div>
    </section>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-view="podio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
        <path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20 7 22"/>
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20 17 22"/>
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
      <span>Podio</span>
    </button>
    <button class="nav-btn" data-view="quiniela">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span>Quiniela</span>
    </button>
  </nav>

  <div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal">
      <h3 class="modal-title">Confirmar pronóstico</h3>
      <div class="modal-body" id="modalBody"></div>
      <p class="modal-warn">Una vez guardado, no podrás editar este pronóstico.</p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>
        <button type="button" class="btn-primary" id="modalConfirm">Guardar</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
